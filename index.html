<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODOアプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>TODO</h1>
      <p class="subtitle" id="summary"></p>
    </header>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="タスクを入力..."
        autocomplete="off"
        maxlength="200"
      />
      <input type="date" id="todo-due" title="期限（任意）" />
      <button type="submit">追加</button>
    </form>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="active">未完了</button>
      <button class="filter-btn" data-filter="completed">完了</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>タスクはありません</p>

    <footer class="app-footer">
      <button id="clear-completed" type="button">完了済みを削除</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
